# Germany configuration

country_code = "de"
tld = ".de"
sparql_query_file = "config/sparql/de.sparql"
domain_prefixes = ["gemeinde-", "stadt-", "markt-", "vg-"]
ehlo_hostname = "mxmap.de"
user_agent = "mxmap.de/1.0 (https://github.com/B42Labs/mxmap)"

skip_domains_extra = ["example.de"]

subpages = [
    "/kontakt",
    "/kontakt/",
    "/impressum",
    "/impressum/",
    "/rathaus",
    "/rathaus/",
    "/verwaltung",
    "/verwaltung/",
    "/buergerservice",
    "/buergerservice/",
    "/de/kontakt",
    "/gemeinde",
    "/gemeinde/",
]

manual_override_ids = []

[manual_overrides]
