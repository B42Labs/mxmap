    "strato.de", "ionos.com", "hetzner.com", "hetzner.de",
    "df.eu", "manitu.de", "hostsharing.net", "jpberlin.de",
    "profihost.com", "mittwald.de", "netcup.de",
]

[site]
domain = "mxmap.de"
title = "MXmap — E-Mail-Provider deutscher Gemeinden"
