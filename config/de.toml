# Germany configuration

country_code = "de"
tld = ".de"
sparql_query_file = "config/sparql/de.sparql"
domain_prefixes = ["gemeinde-", "stadt-", "markt-", "vg-"]
ehlo_hostname = "mxmap.de"
user_agent = "mxmap.de/1.0 (https://github.com/davidhuser/mxmap)"

skip_domains_extra = ["example.de"]

subpages = [
    "/kontakt",
    "/kontakt/",
    "/impressum",
    "/impressum/",
    "/rathaus",
    "/rathaus/",
    "/verwaltung",
    "/verwaltung/",
    "/buergerservice",
    "/buergerservice/",
    "/de/kontakt",
    "/gemeinde",
    "/gemeinde/",
]

manual_override_ids = []

[manual_overrides]
# To be populated as needed

[map]
center_lat = 51.1
center_lon = 10.4
zoom = 6
min_zoom = 5
max_zoom = 14
topojson_url = ""
locale = "de-DE"
country_tlds = [".de"]
domestic_domains = [
    "strato.de", "ionos.com", "hetzner.com", "hetzner.de",
    "df.eu", "manitu.de", "hostsharing.net", "jpberlin.de",
    "profihost.com", "mittwald.de", "netcup.de",
]

[site]
domain = "mxmap.de"
title = "MXmap — E-Mail-Provider deutscher Gemeinden"
tagline = "E-Mail-Provider deutscher Gemeinden"
description = "Interaktive Karte der E-Mail-Provider aller deutschen Gemeinden, basierend auf DNS-Analyse von MX- und SPF-Records."
og_locale = "de_DE"
