[map]
center_lat = 46.8
center_lon = 8.2
zoom = 8
min_zoom = 7
max_zoom = 14
topojson_url = "https://cdn.jsdelivr.net/npm/swiss-maps@4.7.0/2026/ch-combined.json"
locale = "de-CH"
country_tlds = [".ch", ".swiss"]
domestic_domains = [
    "abxsec.com", "swiss-egov.cloud", "sui-inter.net", "ch-dns.net", "cyon.net",
    "seppmail.cloud", "swisscom.com", "privasphere.com", "tinext.com", "cloudrexx.com",
    "mailomat.cloud", "comp-sys.net", "engadin.cloud", "ti-informatique.com",
    "assolo.net", "moresi.com",
]

[site]
domain = "mxmap.ch"
title = "MXmap — Email Providers of Swiss Municipalities"
tagline = "Email Providers of Swiss Municipalities"
description = "Interactive map showing the email providers of all ~2,100 Swiss municipalities, based on DNS analysis of MX and SPF records."
og_locale = "en_CH"
