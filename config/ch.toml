# Switzerland configuration

country_code = "ch"
tld = ".ch"
sparql_query_file = "config/sparql/ch.sparql"
domain_prefixes = ["gemeinde-", "commune-de-"]
ehlo_hostname = "mxmap.ch"
user_agent = "mxmap.ch/1.0 (https://github.com/davidhuser/mxmap)"

skip_domains_extra = ["example.ch"]

subpages = [
    "/kontakt",
    "/contact",
    "/impressum",
    "/kontakt/",
    "/contact/",
    "/impressum/",
    "/de/kontakt",
    "/fr/contact",
    "/it/contatto",
    "/verwaltung",
    "/administration",
    "/autorites",
    "/gemeinde",
    "/commune",
    "/comune",
]

manual_override_ids = [
    "6404", "6408", "6413", "6416", "6417", "6423",
    "6432", "6433", "6434", "6435", "6437",
    "6451", "6455", "6456", "6458", "6487", "6504",
    "422",
]

# Neuchatel canton: all use @ne.ch (cantonal mail gateway operated by SIEN,
# MX points to cantonal servers on SWITCH AS559)
[manual_overrides."6404"]
domain = "ne.ch"
provider = "independent"
gateway = "cantonal-ne"
mx = ["nemx9a.ne.ch", "ne2mx9a.ne.ch"]
spf = "v=spf1 include:spf1.ne.ch include:spf.protection.outlook.com ~all"

